<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ERP Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px 0;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">🚀 Crear Cuenta</h2>
                            <p class="text-muted">Comienza tu prueba gratuita ahora</p>
                        </div>

                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'danger' else 'warning' if category == 'warning' else 'success' }} alert-dismissible fade show" role="alert">
                                    {{ message|safe }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form method="POST" action="{{ url_for('registro') }}" id="formRegistro">
                            <!-- Nombre del usuario -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre Completo *</label>
                                <input type="text" name="nombre" class="form-control" placeholder="Juan Pérez" required autofocus>
                            </div>

                            <!-- Correo -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Correo Electrónico *</label>
                                <input type="email" name="correo" id="correo" class="form-control" placeholder="tu@correo.com" required>
                            </div>

                            <!-- Confirmar Correo -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Confirmar Correo Electrónico *</label>
                                <input type="email" name="confirmar_correo" id="confirmar_correo" class="form-control" placeholder="tu@correo.com" required>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Contraseña *</label>
                                <input type="password" name="contrasena" id="contrasena" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
                            </div>

                            <!-- Confirmar Contraseña -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Confirmar Contraseña *</label>
                                <input type="password" name="confirmar_contrasena" id="confirmar_contrasena" class="form-control" placeholder="Repite tu contraseña" required minlength="6">
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                                Crear Cuenta
                            </button>

                            <div class="text-center">
                                <span class="text-muted">¿Ya tienes cuenta?</span>
                                <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">
                                    Inicia sesión aquí
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Validación en el cliente
        document.getElementById('formRegistro').addEventListener('submit', function(e) {
            const correo = document.getElementById('correo').value;
            const confirmarCorreo = document.getElementById('confirmar_correo').value;
            const contrasena = document.getElementById('contrasena').value;
            const confirmarContrasena = document.getElementById('confirmar_contrasena').value;

            if (correo !== confirmarCorreo) {
                e.preventDefault();
                alert('⚠️ Los correos electrónicos no coinciden.');
                document.getElementById('confirmar_correo').focus();
                return false;
            }

            if (contrasena !== confirmarContrasena) {
                e.preventDefault();
                alert('⚠️ Las contraseñas no coinciden.');
                document.getElementById('confirmar_contrasena').focus();
                return false;
            }
        });

        // Validación en tiempo real del correo
        document.getElementById('confirmar_correo').addEventListener('input', function() {
            const correo = document.getElementById('correo').value;
            const confirmarCorreo = this.value;
            
            if (confirmarCorreo && correo !== confirmarCorreo) {
                this.classList.add('is-invalid');
                this.classList.remove('is-valid');
            } else if (confirmarCorreo) {
                this.classList.add('is-valid');
                this.classList.remove('is-invalid');
            }
        });

        // Validación en tiempo real de la contraseña
        document.getElementById('confirmar_contrasena').addEventListener('input', function() {
            const contrasena = document.getElementById('contrasena').value;
            const confirmarContrasena = this.value;
            
            if (confirmarContrasena && contrasena !== confirmarContrasena) {
                this.classList.add('is-invalid');
                this.classList.remove('is-valid');
            } else if (confirmarContrasena) {
                this.classList.add('is-valid');
                this.classList.remove('is-invalid');
            }
        });
    </script>
</body>
</html>
